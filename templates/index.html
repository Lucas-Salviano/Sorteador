<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorteador de números</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Sorteador de números</h1>
    <form id="form">
      <label>De (x)
        <input type="number" id="x" value="1" required>
      </label>
      <label>Até (y)
        <input type="number" id="y" value="60" required>
      </label>
      <label>Quantidade
        <input type="number" id="quantidade" value="1" min="1" required>
      </label>
      <label class="check">
        <input type="checkbox" id="repetir"> Permitir repetições
      </label>
      <button type="submit">Sortear</button>
    </form>
    <p id="resultado" aria-live="polite">—</p>
    <p id="erro" class="erro" role="alert"></p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
