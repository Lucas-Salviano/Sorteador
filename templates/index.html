<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorteador de números</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <header>
      <img class="banana" src="{{ url_for('static', filename='banana.svg') }}" alt="Banana verde e amarela">
      <h1>Sorteador de números</h1>
      <p class="sub">Escolha o intervalo e deixe a sorte decidir</p>
    </header>

    <form id="form">
      <div class="row">
        <label>De (x)
          <input type="number" id="x" value="1" required>
        </label>
        <label>Até (y)
          <input type="number" id="y" value="60" required>
        </label>
      </div>
      <label>Quantidade
        <input type="number" id="quantidade" value="1" min="1" required>
      </label>
      <label class="check">
        <input type="checkbox" id="repetir"> Permitir números repetidos
      </label>
      <button type="submit">Sortear</button>
    </form>

    <div id="resultado" class="resultado" aria-live="polite">
      <span class="vazio">Os números sorteados aparecem aqui</span>
    </div>
    <p id="erro" class="erro" role="alert"></p>

    <footer class="autor">
      <strong>Lucas Salviano da Costa Pinheiro</strong>
      <span>Matrícula: 23300012</span>
    </footer>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
